# Cold start: the app opens in Arabic on the tab bar with all five tabs (testIDs from packages/contracts testIDs.tabs),
# then switching the language to English from the account tab (signed out) flips the tab labels.
appId: iq.iraqmaps.app
name: launch-tabs
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: tab.map
    timeout: 60000
- assertVisible:
    id: tab.discover
- assertVisible:
    id: tab.messages
- assertVisible:
    id: tab.activity
- assertVisible:
    id: tab.account
- assertVisible: الخريطة
- tapOn:
    id: tab.account
- tapOn:
    id: account.language
- tapOn:
    id: auth.locale.en
# ar -> en flips the layout direction, so the app reloads before the labels change.
- extendedWaitUntil:
    visible: Map
    timeout: 30000
- assertNotVisible: الخريطة
