# Closure gate (CLAUDE.md §2.5): `pnpm gate` on PostGIS + Redis service containers, then the Android precheck.
# No secrets: the identity keys are generated per run (e2e/ci-secrets.sh) and masked.
name: ci
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.2@sha256:46f15cf64fdef63e483dcda99e74e3d51c017b1175547b6bb874152ee2391aad # 7.2: the last BSD-3 Redis line
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      APP_ENV: e2e
      OTP_SENDER: fixed
      OTP_FIXED_CODE: '123456'
      # The container's superuser: createTestDatabase() creates the PostGIS + pg_trgm template database.
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      TEST_DATABASE_ADMIN_URL: postgres://postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # ownership:check diffs against the M0 closure commit 2937c16
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: geo-services/pipeline/requirements.txt
      - name: Install gitleaks (checksum-verified) and osmium-tool
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo install gitleaks /usr/local/bin/
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      # Java 21 + Maven (preinstalled) for the geo-services/tiles Planetiler test; ~/.m2 cached by pom.xml.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: geo-services/tiles/pom.xml
      # planetiler.jar (93MB, SHA-256 checked by scripts/planetiler.sh on every run; ADR-0008).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: geo-services/tiles/.cache
          key: planetiler-${{ hashFiles('geo-services/tiles/scripts/planetiler.sh') }}
      - run: sh e2e/ci-secrets.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm gate
      - run: pnpm android:precheck
        env:
          CI: 1
