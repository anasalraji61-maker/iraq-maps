# OSM city data from the public Geofabrik Iraq extract (ADR-0008). Read-only: no secrets, no pushes, no releases.
# - osm-quality: the first-city quality report (MVP.md section 1, task T01).
# - city-data: the data-<city>-<date> artifact for Baghdad: places.ndjson, city.json, ATTRIBUTION.txt, and
#   <city>.pmtiles + glyphs/ once geo-services/tiles is implemented (geo-services/pipeline/scripts/city-data.sh).
# - perf: imports that artifact into a CI PostGIS and measures /v1/search p95 against the budget (M1 criterion 8).
name: geo-data
on:
  push:
    paths:
      - 'geo-services/**'
      - 'modules/places/**'
      - 'tools/bench/**'
      - '.github/workflows/geo-data.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geo-data-${{ github.ref }}
  cancel-in-progress: true
env:
  EXTRACT_URL: https://download.geofabrik.de/asia/iraq-latest.osm.pbf
jobs:
  osm-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: geo-services/pipeline
    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - &python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: geo-services/pipeline/requirements.txt
      - &osmium
        name: Install osmium-tool
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Unit tests
        run: sh scripts/py.sh -m pytest -q
      - name: Validate city configs
        run: sh scripts/py.sh -m quality.cities validate cities/*.yaml
      - name: Download Geofabrik Iraq extract
        run: sh scripts/fetch-extract.sh "$EXTRACT_URL" data
      - name: Clip cities and compute metrics
        run: |
          AS_OF=$(date -u +%F)
          for cfg in cities/*.yaml; do
            c=$(basename "$cfg" .yaml)
            sh scripts/py.sh -m quality.cities clip "$cfg" data/iraq-latest.osm.pbf "data/$c.osm.pbf"
            sh scripts/py.sh -m quality.metrics --city "$cfg" --input "data/$c.osm.pbf" --as-of "$AS_OF" -o "out/$c.json"
          done
      - name: Compare and decide
        run: |
          sh scripts/py.sh -m quality.compare --base out/erbil.json --challenger out/baghdad.json \
            --json out/osm-quality.json --md out/osm-quality.md
          cat out/osm-quality.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osm-quality-report
          path: |
            geo-services/pipeline/out/*.json
            geo-services/pipeline/out/*.md
          if-no-files-found: error
          retention-days: 90

  city-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CITY: baghdad
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - *checkout
      - &pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - &node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - *python
      # Java 21 + Maven and planetiler.jar for geo-services/tiles, as in ci.yml.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: geo-services/tiles/pom.xml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: geo-services/tiles/.cache
          key: planetiler-${{ hashFiles('geo-services/tiles/scripts/planetiler.sh') }}
      - *osmium
      - &install
        run: pnpm install --frozen-lockfile
      - name: Download Geofabrik Iraq extract
        run: sh geo-services/pipeline/scripts/fetch-extract.sh "$EXTRACT_URL" "$RUNNER_TEMP/osm"
      - name: Extract the city, build tiles and glyphs
        id: build
        run: |
          artifact="data-$CITY-$(date -u +%F)"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          sh geo-services/pipeline/scripts/city-data.sh "$CITY" "$RUNNER_TEMP/osm/iraq-latest.osm.pbf" "$RUNNER_TEMP/data"
          { echo "### $artifact"; echo '```'; du -sh "$RUNNER_TEMP"/data/*; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            ${{ runner.temp }}/data/
            !${{ runner.temp }}/data/*.osm.pbf
          if-no-files-found: error
          retention-days: 30

  perf:
    needs: city-data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash # -eo pipefail, so the bench's exit code survives tee
    services:
      postgres:
        image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7.2@sha256:46f15cf64fdef63e483dcda99e74e3d51c017b1175547b6bb874152ee2391aad # 7.2: the last BSD-3 Redis line
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      CITY: baghdad
      APP_ENV: e2e
      OTP_SENDER: fixed
      OTP_FIXED_CODE: '123456'
      API_PORT: 3000
      DATABASE_URL: postgres://postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - *checkout
      - *pnpm
      - *node
      - *install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.city-data.outputs.artifact }}
          path: ${{ runner.temp }}/data
      - run: sh e2e/ci-secrets.sh
      - name: Migrate, then import the city (CliContracts.placesImport)
        run: |
          pnpm --filter @iraq-maps/api migrate
          cd modules/places # `pnpm run` from the package fails on a missing script; `import` is also a pnpm command
          pnpm run import --city "$RUNNER_TEMP/data/city.json" --input "$RUNNER_TEMP/data/places.ndjson"
      - name: Start the API
        run: e2e/mobile/start-api.sh
        env:
          API_LOG: ${{ runner.temp }}/api.log
      - name: Search p95 within 800ms (CliContracts.benchSearch)
        working-directory: tools/bench
        run: |
          pnpm --silent run search --api "http://localhost:$API_PORT" --city "$CITY" \
            --input "$RUNNER_TEMP/data/places.ndjson" --count 200 --budget-ms 800 | tee "$RUNNER_TEMP/bench.json"
      - name: Counts and p95 in the job summary
        if: always()
        run: |
          {
            echo "### $CITY: imported records"
            echo '| kind | records |'
            echo '|---|---:|'
            jq -r .kind "$RUNNER_TEMP/data/places.ndjson" | sort | uniq -c | awk '{print "| " $2 " | " $1 " |"}'
            jq -r '"\n/v1/search: p95 \(.p95Ms) ms (budget 800), p50 \(.p50Ms) ms, max \(.maxMs) ms, \(.count) queries, \(.errors) errors"' \
              "$RUNNER_TEMP/bench.json" || echo 'No bench result.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: API log
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/api.log" || true
