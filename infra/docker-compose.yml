# Developer machines with Docker only. The agent environment has no Docker: use `pnpm infra:local up` (ADR-0004).
# PostGIS matches the CI service container. The dev credentials match infra/local/infra.sh and are not secret,
# so DATABASE_URL=postgres://iraqmaps:iraqmaps@localhost:5432/iraqmaps and REDIS_URL=redis://localhost:6379 work unchanged.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: iraqmaps
      POSTGRES_PASSWORD: iraqmaps
      POSTGRES_DB: iraqmaps
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    # 7.2 is the last BSD-3 Redis line; 7.4+ is RSALv2/SSPLv1, which is not OSI-licensed (licensing audit LIC-08).
    image: redis:7.2
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
